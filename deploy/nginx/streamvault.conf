# ==============================================================================
# VELVETVAULT PRO — PRODUCTION NGINX STREAMING CONFIGURATION
# Optimized for 4K MP4 Pseudo-Streaming, HLS (.m3u8 / .ts), and Large Uploads
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 10G;
    client_body_buffer_size 512k;
    client_body_timeout 3600s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/vnd.apple.mpegurl video/mp2t;

    # Compliance & Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Adult-Rating "RTA-5042-1996-1400-1577-RTA" always;

    # High-Performance HLS & MP4 Media Delivery
    location /uploads/ {
        alias /var/www/velvetvault/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
    }

    # Reverse Proxy to Node.js Streaming Engine
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }
}
