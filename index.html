    <style>
        :root {
            --neon-primary: #00f3ff;
            --neon-secondary: #bc13fe;
            --bg-color: #050510;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: float 10s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: rgba(0, 243, 255, 0.4);
            top: -50px;
            right: -50px;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: rgba(188, 19, 254, 0.3);
            bottom: -100px;
            left: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-30px, 50px) scale(1.1); }
        }

        /* Glassmorphism Container */
        .glass-container {
            background: rgba(20, 20, 35, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.1), inset 0 0 20px rgba(255, 255, 255, 0.05);
            z-index: 10;
            width: 100%;
            max-width: 500px;
            margin: 20px;
            border-radius: 24px;
            padding: 40px 30px;
            position: relative;
            overflow: hidden;
        }

        /* Top highlight line for glass */
        .glass-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 200%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-primary), transparent);
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Neon Text */
        .neon-text {
            color: #fff;
            text-shadow: 0 0 10px var(--neon-primary), 0 0 20px var(--neon-primary);
        }

        /* Form Elements */
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .neon-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px 15px;
            border-radius: 12px;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        .neon-input:focus {
            border-color: var(--neon-primary);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            background: rgba(0, 0, 0, 0.4);
        }

        .neon-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* Checkboxes */
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 10px;
        }
        
        @media (max-width: 400px) {
            .checkbox-group {
                grid-template-columns: 1fr;
            }
        }

        .custom-checkbox {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: all 0.3s ease;
            color: #ccc;
        }

        .custom-checkbox:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .custom-checkbox input {
            display: none;
        }

        .checkmark {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 6px;
            margin-left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .custom-checkbox input:checked + .checkmark {
            background: var(--neon-primary);
            border-color: var(--neon-primary);
            box-shadow: 0 0 10px var(--neon-primary);
        }

        .custom-checkbox input:checked + .checkmark::after {
            content: '✓';
            color: #000;
            font-size: 14px;
            font-weight: bold;
        }
        
        .custom-checkbox input:checked ~ span {
            color: #fff;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }

        /* Neon Button */
        .neon-btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            color: #fff;
            border: 2px solid var(--neon-primary);
            border-radius: 12px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0, 243, 255, 0.1);
        }

        .neon-btn:hover {
            background: var(--neon-primary);
            color: #000;
            box-shadow: 0 0 20px var(--neon-primary), 0 0 40px var(--neon-primary);
            text-shadow: none;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: rgba(20, 20, 35, 0.85);
            border: 1px solid var(--neon-primary);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            color: white;
            transform: translateY(20px);
            transition: transform 0.3s ease;
            max-width: 90%;
            width: 350px;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .modal-close-btn {
            margin-top: 20px;
            padding: 8px 25px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--neon-primary);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-close-btn:hover {
            background: var(--neon-primary);
            color: black;
        }

        /* Loading Spinner */
        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }

        .btn-content {
            display: block;
        }

        .loading .loader {
            display: block;
        }

        .loading .btn-content {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <!-- Background Animations -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="glass-container">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold neon-text mb-2">ثبت نام تیم رسانه</h1>
            <p class="text-gray-400 text-sm">عضویت در تیم ادیتورها، تصویربرداران و عکاسان</p>
        </div>

        <form id="registrationForm">
            <div class="input-group">
                <input type="text" id="name" class="neon-input" placeholder="نام و نام خانوادگی *" required>
            </div>
            
            <div class="input-group">
                <input type="number" id="age" class="neon-input" placeholder="سن *" required min="10" max="99">
            </div>

            <div class="input-group">
                <input type="tel" id="phone" class="neon-input" placeholder="شماره تماس (مثال: 0912...) *" required>
            </div>

            <div class="input-group">
                <input type="text" id="telegram" class="neon-input" placeholder="آیدی تلگرام (بدون @) *" required>
            </div>

            <div class="mb-6">
                <label class="block text-gray-300 mb-2 text-sm">چه کارهایی رو می‌تونید انجام بدید؟ *</label>
                <div class="checkbox-group">
                    <label class="custom-checkbox">
                        <input type="checkbox" name="skills" value="ادیتور ویدیو">
                        <div class="checkmark"></div>
                        <span>ادیتور ویدیو</span>
                    </label>
                    
                    <label class="custom-checkbox">
                        <input type="checkbox" name="skills" value="تصویربردار">
                        <div class="checkmark"></div>
                        <span>تصویربردار</span>
                    </label>
                    
                    <label class="custom-checkbox">
                        <input type="checkbox" name="skills" value="عکاس">
                        <div class="checkmark"></div>
                        <span>عکاس</span>
                    </label>

                    <label class="custom-checkbox">
                        <input type="checkbox" name="skills" value="گرافیست">
                        <div class="checkmark"></div>
                        <span>گرافیست / کاور زن</span>
                    </label>
                </div>
                <p id="skillError" class="text-red-400 text-xs mt-2 hidden">لطفاً حداقل یک مهارت را انتخاب کنید.</p>
            </div>

            <button type="submit" id="submitBtn" class="neon-btn">
                <span class="btn-content">ارسال فرم درخواست</span>
                <div class="loader"></div>
            </button>
        </form>
    </div>

    <!-- Custom Modal Message Box -->
    <div class="modal-overlay" id="messageModal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">✅</div>
            <h3 class="text-xl font-bold mb-2" id="modalTitle">موفقیت‌آمیز</h3>
            <p class="text-sm text-gray-300" id="modalDesc">اطلاعات شما با موفقیت برای ما ارسال شد.</p>
            <button class="modal-close-btn" onclick="closeModal()">بستن</button>
        </div>
    </div>

    <script>
        // Telegram Configuration (From User Request)
        const TELEGRAM_BOT_TOKEN = '8899315197:AAHfKqtG5tY9764ORGLXTJuIe12aLS9mGkc';
        const TELEGRAM_CHAT_ID = '7403377873';

        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const skillError = document.getElementById('skillError');
        const modal = document.getElementById('messageModal');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Check if at least one skill is selected
            const checkedSkills = document.querySelectorAll('input[name="skills"]:checked');
            if(checkedSkills.length === 0) {
                skillError.classList.remove('hidden');
                return;
            } else {
                skillError.classList.add('hidden');
            }

            // UI Loading state
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            // Get Values
            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            const phone = document.getElementById('phone').value;
            const telegram = document.getElementById('telegram').value;
            
            let skillsArray = [];
            checkedSkills.forEach(cb => skillsArray.push(cb.value));
            const skillsText = skillsArray.join(' ، ');

            // Construct Message for Telegram
            const message = `
🌟 <b>درخواست همکاری جدید</b> 🌟

👤 <b>نام:</b> ${name}
🎂 <b>سن:</b> ${age}
📱 <b>شماره تماس:</b> ${phone}
✈️ <b>آیدی تلگرام:</b> @${telegram}
🎯 <b>مهارت‌ها:</b> ${skillsText}
            `;

            // Telegram API URL
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

            // Send Data via Fetch
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: 'HTML' // Enables bold and HTML tags in telegram message
                })
            })
            .then(response => response.json())
            .then(data => {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;

                if(data.ok) {
                    showModal('✅', 'ارسال موفق', 'اطلاعات شما با موفقیت ثبت و ارسال شد. به زودی با شما تماس می‌گیریم.');
                    form.reset(); // Clear the form
                } else {
                    showModal('❌', 'خطا در ارسال', 'متأسفانه مشکلی در ارسال پیش آمد. لطفا دوباره تلاش کنید.');
                    console.error("Telegram API Error: ", data);
                }
            })
            .catch(error => {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
                showModal('🔌', 'خطای اتصال', 'لطفا اتصال اینترنت (و یا VPN در صورت نیاز) خود را بررسی کنید.');
                console.error("Network Error: ", error);
            });
        });

        // Modal Logic
        function showModal(icon, title, desc) {
            document.getElementById('modalIcon').innerText = icon;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            
            // Adjust colors based on success/error
            if(icon === '❌' || icon === '🔌') {
                document.querySelector('.modal-content').style.borderColor = '#ff0055';
                document.querySelector('.modal-content').style.boxShadow = '0 0 30px rgba(255, 0, 85, 0.2)';
                document.querySelector('.modal-close-btn').style.borderColor = '#ff0055';
            } else {
                document.querySelector('.modal-content').style.borderColor = 'var(--neon-primary)';
                document.querySelector('.modal-content').style.boxShadow = '0 0 30px rgba(0, 243, 255, 0.2)';
                document.querySelector('.modal-close-btn').style.borderColor = 'var(--neon-primary)';
            }

            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }
    </script>
</body>
</html>
