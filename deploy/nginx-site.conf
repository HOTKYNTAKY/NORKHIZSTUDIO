# گلیستا — Nginx برای نصب مستقیم روی سرور لینوکسی
# install.sh این فایل را کپی کرده و نام سرور (apex + www)، ریشه وب و پورت API
# را جایگزین می‌کند تا هم دامنه اصلی و هم www (در صورت وجود رکورد DNS)
# با همین vhost سرو شوند.
server {
    listen       80;
    listen       [::]:80;
    server_name  __SERVERNAME__;
    root         __ROOT__;
    index        index.html;

    # ── فشرده‌سازی ──────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml text/xml font/woff2;

    # ── هدرهای امنیتی ───────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # بعد از فعال‌شدن HTTPS، HSTS را فعال کنید:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 30m;   # آپلود تصاویر محصول از پنل ادمین

    # ── API فروشگاه (Node بدون وابستگی) ─────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:__APIPORT__;
        proxy_http_version 1.1;
        set $nk_real_ip $remote_addr;
        if ($http_cf_connecting_ip) { set $nk_real_ip $http_cf_connecting_ip; }
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $nk_real_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 30m;
    }

    # ── پنل مدیریت ──────────────────────────────────────────────
    location = /admin {
        proxy_pass http://127.0.0.1:__APIPORT__/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /admin/ {
        proxy_pass http://127.0.0.1:__APIPORT__/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ── تصاویر آپلودشده در پنل ──────────────────────────────────
    location /uploads/ {
        proxy_pass http://127.0.0.1:__APIPORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── دارایی‌های استاتیک ───────────────────────────────────────
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── صفحات HTML بدون کش ──────────────────────────────────────
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.html;

    access_log /var/log/nginx/golistahome.access.log;
    error_log  /var/log/nginx/golistahome.error.log;
}
