server {
    listen 80;
    listen [::]:80;
    server_name www.vortexnett.shop;
    location ^~ /.well-known/acme-challenge/ { root /var/www/vortexnet-acme; }
    location / { return 301 https://www.vortexnett.shop$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.vortexnett.shop;
    ssl_certificate /etc/letsencrypt/live/www.vortexnett.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.vortexnett.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/vortexnet;
    index index.html;
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /admin { proxy_pass http://127.0.0.1:9273; }
    location = /admin/ { proxy_pass http://127.0.0.1:9273; }
    location /api/ {
        proxy_pass http://127.0.0.1:9273;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 45s;
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache" always; try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
